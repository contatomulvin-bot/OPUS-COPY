services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mistcut
      POSTGRES_USER: mistcut
      POSTGRES_PASSWORD: change-me-now
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mistcut_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mistcut -d mistcut"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mistcut_pg_data:
