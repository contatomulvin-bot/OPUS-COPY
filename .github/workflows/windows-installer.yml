name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - install.ps1
      - installer/**
      - .github/workflows/windows-installer.yml

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\install.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress --yes

      - name: Build Setup EXE
        shell: powershell
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $compiler '.\installer\OPUS-COPY.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-FileHash '.\installer\output\OPUS-COPY-Setup.exe' -Algorithm SHA256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPUS-COPY-Setup
          path: installer/output/OPUS-COPY-Setup.exe
          if-no-files-found: error

      - name: Publish rolling installer release
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'installer-latest'
          $asset = '.\installer\output\OPUS-COPY-Setup.exe'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --force $tag $env:GITHUB_SHA
          git push origin "refs/tags/$tag" --force
          $previousPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          gh release view $tag 2>$null 1>$null
          $releaseExists = $LASTEXITCODE -eq 0
          $ErrorActionPreference = $previousPreference
          if ($releaseExists) {
            gh release upload $tag $asset --clobber
            gh release edit $tag --title 'OPUS-COPY — Instalador Windows' --notes 'Instalador automático mais recente para Windows 10/11 de 64 bits.' --latest
          } else {
            gh release create $tag $asset --title 'OPUS-COPY — Instalador Windows' --notes 'Instalador automático mais recente para Windows 10/11 de 64 bits.' --latest
          }
